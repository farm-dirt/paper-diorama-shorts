<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
@font-face{font-family:Cap;src:url(assets/Fraunces-Black.woff)}
:root{--bg:#efe6d4;--panel:#fbf6ec;--ink:#2b1f1d;--mute:#76665c;--line:#ddd0b8;--accent:#e0a33a;--accent2:#2f6f73;--danger:#d2453a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1816;--panel:#26201c;--ink:#f2e9dc;--mute:#b3a597;--line:#3d342d;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
header{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
header h1{font:900 20px Cap,Georgia,serif;margin:0}
header .meta{color:var(--mute);font-size:13px}
main{display:grid;grid-template-columns:minmax(260px,440px) minmax(0,1fr);gap:20px;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1200px;margin:0 auto}
@media (max-width:820px){main{grid-template-columns:minmax(0,1fr)}.stage{max-width:420px;margin:0 auto}}
button:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent2);outline-offset:2px}
.stage{position:relative;background:#000;border-radius:18px;overflow:hidden;aspect-ratio:9/16;width:min(100%,calc((100dvh - 230px) * 9 / 16));min-width:min(100%,260px);max-width:100%;margin:0 auto;box-shadow:0 6px 24px rgba(0,0,0,.2)}
.stage video{width:100%;height:100%;display:block;object-fit:contain;background:#000}
.stage:fullscreen,.stage.fakefs{width:100vw!important;height:100vh!important;max-width:none!important;border-radius:0!important;aspect-ratio:auto!important;margin:0!important}
.stage.fakefs{position:fixed!important;inset:0;z-index:9999}
.fsx{display:none;position:absolute;top:12px;right:12px;z-index:5;background:rgba(0,0,0,.55);color:#fff;border:0;border-radius:20px;padding:8px 14px;font:600 15px system-ui;cursor:pointer}
.stage.fakefs .fsx,.stage:fullscreen .fsx{display:block}
.safe{position:absolute;inset:0;pointer-events:none;display:none}
.safe.on{display:block}
.safe .b{position:absolute;background:rgba(255,40,40,.22);border:1px dashed rgba(255,60,60,.8)}
.safe span{position:absolute;color:#fff;font-size:11px;background:rgba(0,0,0,.5);padding:1px 4px;border-radius:3px}
.bigplay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.15);cursor:pointer;border:0;width:100%}
.bigplay span{width:76px;height:76px;border-radius:50%;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;font-size:30px;color:#2b1f1d}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
button,select{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:7px 12px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#2b1f1d;font-weight:700}
button.on{background:var(--accent2);color:#fff;border-color:var(--accent2)}
.time{font-variant-numeric:tabular-nums;color:var(--mute);font-size:13px;margin-left:auto}
.timeline{position:relative;height:40px;margin-top:12px;border-radius:10px;overflow:hidden;background:var(--panel);border:1px solid var(--line);cursor:pointer;touch-action:none}
.timeline .seg{position:absolute;top:0;bottom:0;border-right:1px solid rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#2b1f1d;overflow:hidden}
.timeline .head{position:absolute;top:0;bottom:0;width:3px;background:var(--danger);pointer-events:none}
.scenes{display:flex;flex-direction:column;gap:10px}
.scene{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:grid;grid-template-columns:64px 1fr;gap:12px}
.scene>div{min-width:0}
.scene.cur{outline:3px solid var(--accent)}
.scene img{width:64px;height:114px;object-fit:cover;border-radius:8px;background:#000;cursor:pointer}
.scene h3{margin:0;font-size:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{font-size:11px;padding:1px 8px;border-radius:99px;color:#2b1f1d}
.scene p{margin:4px 0 6px;color:var(--mute);font-size:13px}
.scene .say{font-style:italic;color:var(--ink)}
textarea{width:100%;min-height:38px;font:inherit;font-size:13px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--bg);color:var(--ink);resize:vertical}
.row{display:flex;gap:6px;flex-wrap:wrap}
.feedback{position:sticky;bottom:0;background:var(--bg);padding:10px 0;display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2b1f1d;color:#fff;padding:10px 16px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
#out{width:100%;min-height:90px;display:none;margin-top:6px}

/* layout: the video stays put, only the scene list scrolls (user request) */
body:not(.render){height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column}
body:not(.render) main{flex:1;min-height:0;width:100%;grid-template-rows:minmax(0,1fr)}
body:not(.render) .player{min-height:0;overflow-y:auto;scrollbar-width:none}
body:not(.render) .side{min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-right:4px;display:flex;flex-direction:column}
.side .scenes{flex:1 0 auto}
body:not(.render) .stage{width:min(100%,calc((100dvh - 260px) * 9 / 16))}
.scene{cursor:pointer}
.scene textarea,.scene button{cursor:auto}
.scene button{cursor:pointer}
/* timestamp marks */
.markb{position:absolute;left:10px;top:10px;z-index:6;background:rgba(0,0,0,.55);color:#fff;border:0;border-radius:20px;padding:7px 12px;font:700 14px system-ui;cursor:pointer}
.markb:active{transform:scale(.94)}
.timeline .mk{position:absolute;top:0;bottom:0;width:3px;margin-left:-1px;background:#c0172b;box-shadow:0 0 0 1px #fff;pointer-events:none}
.marks{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 6px}
.marks:empty{display:none}
.mchip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:2px 4px 2px 9px;border-radius:99px;background:#fde3e3;color:#8a1020;border:1px solid #f0b4b4}
.mchip button{border:0;background:none;padding:0 5px;color:inherit;font-size:13px;line-height:1}
.scene .mcount{font-size:11px;font-weight:700;color:#c0172b}
@media (max-width:820px){
  header{padding-block:6px}
  header .meta{display:none}
  body:not(.render) main{grid-template-rows:auto minmax(0,1fr);gap:10px;padding-block:8px}
  body:not(.render) .player{overflow:visible}
  body:not(.render) .stage{width:min(100%,calc(36dvh * 9 / 16));min-width:0}
  .timeline{margin-top:8px;height:30px}
  .controls{flex-wrap:nowrap;overflow-x:auto;gap:6px;margin-top:8px;padding-bottom:2px;scrollbar-width:none}
  .controls>*{flex:0 0 auto}
  .controls button,.controls select{padding:6px 10px;font-size:13px}
}
</style>
<header><h1 id="title">Preview</h1><span class="meta" id="meta"></span></header>
<main>
  <section class="player">
    <div class="stage" id="stage">
      <video id="vid" src="preview.mp4" playsinline preload="auto"></video>
      <div class="safe" id="safe">
        <div class="b" style="left:0;right:0;top:0;height:7%"><span style="left:6px;top:4px">top UI</span></div>
        <div class="b" style="left:0;right:0;bottom:0;height:20%"><span style="left:6px;top:4px">title / channel / description</span></div>
        <div class="b" style="right:0;width:13%;top:42%;bottom:20%"><span style="right:4px;top:4px">buttons</span></div>
      </div>
      <button class="markb" id="markov" title="Mark this moment (M)">⏱ Mark</button>
      <button class="fsx" id="fsx">✕ Exit full screen</button>
      <button class="bigplay" id="bigplay" aria-label="Play"><span>▶</span></button>
    </div>
    <div class="timeline" id="tl"><div class="head" id="head"></div></div>
    <div class="controls">
      <button class="primary" id="play">▶ Play</button>
      <button id="prevf" title="previous frame">◀︎ frame</button>
      <button id="nextf" title="next frame">frame ▶︎</button>
      <button id="loop">Loop scene</button>
      <button id="fsb" title="Full screen (or double-click the video, or press F)">⛶ Full screen</button>
      <select id="speed"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option></select>
      <button id="markb" title="Mark this moment so you know which scene to change (key: M)">⏱ Mark</button>
      <button id="safeb">Safe zones</button>
      <span class="time" id="time">0.00 s</span>
    </div>
  </section>
  <section class="side">
    <div class="scenes" id="scenes"></div>
    <div class="feedback">
      <button class="primary" id="copy">Send notes to Claude</button>
      <button id="approve">✓ Approve — render final</button>
      <textarea id="out" readonly></textarea>
    </div>
  </section>
</main>
<div class="toast" id="toast"></div>
<script src="data.js"></script>
<script>
const P = window.PROJECT, FPS = P.fps || 24, DUR = P.dur;
const $ = (id) => document.getElementById(id);
const v = $('vid');
const COLORS = ['#e0a33a', '#7fb3a6', '#d98a6a', '#b7a0c9', '#c9b06a', '#8fb0d6', '#d6a0a0', '#a8c68a'];
$('title').textContent = P.title || 'Preview';
$('meta').textContent = `${DUR.toFixed(2)} s · ${FPS} fps · full size 1080×1920 (this is the final render) · ${P.scenes.length} scenes`;
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, val) { try { localStorage.setItem(k, val); } catch (e) {} } };
const KEY = 'pds-notes-' + (P.slug || P.title);
let notes = {}; try { notes = JSON.parse(store.get(KEY) || '{}'); } catch (e) {}
let loopScene = null;
const GET_T = () => v.currentTime, SEEK = (x) => { v.currentTime = Math.max(0, Math.min(DUR - 0.01, x)); };
function LOOP_OFF() { loopScene = null; $('loop').classList.remove('on'); }
const sceneAt = (t) => { for (let i = 0; i < P.scenes.length; i++) if (t < P.scenes[i].end) return i; return P.scenes.length - 1; };
const SCENE_AT = sceneAt;
function setPlay(p) { if (p) { v.play().catch(() => {}); } else v.pause(); }
v.addEventListener('play', () => { $('play').textContent = '❚❚ Pause'; $('bigplay').style.display = 'none'; });
v.addEventListener('pause', () => { $('play').textContent = '▶ Play'; });
$('play').onclick = () => setPlay(v.paused);
$('bigplay').onclick = () => setPlay(true);
v.onclick = () => setPlay(v.paused);
v.addEventListener('ended', () => { v.currentTime = loopScene ? loopScene.start : 0; v.play().catch(() => {}); }); // loops like a Short
$('prevf').onclick = () => { setPlay(false); v.currentTime = Math.max(0, v.currentTime - 1 / FPS); };
$('nextf').onclick = () => { setPlay(false); v.currentTime = Math.min(DUR, v.currentTime + 1 / FPS); };
$('speed').onchange = (e) => { v.playbackRate = +e.target.value; };
$('safeb').onclick = () => { $('safe').classList.toggle('on'); $('safeb').classList.toggle('on'); };
$('loop').onclick = () => { loopScene = loopScene ? null : P.scenes[sceneAt(v.currentTime)]; $('loop').classList.toggle('on', !!loopScene); };
// timeline
const tl = $('tl');
P.scenes.forEach((s, i) => { const d = document.createElement('div'); d.className = 'seg'; d.style.left = (s.start / DUR * 100) + '%'; d.style.width = ((s.end - s.start) / DUR * 100) + '%'; d.style.background = COLORS[i % COLORS.length]; d.textContent = i + 1; tl.appendChild(d); });
function seekX(e) { LOOP_OFF(); const r = tl.getBoundingClientRect(); v.currentTime = Math.max(0, Math.min(DUR - 0.01, (e.clientX - r.left) / r.width * DUR)); }
tl.addEventListener('pointerdown', (e) => { seekX(e); tl.setPointerCapture(e.pointerId); tl.onpointermove = seekX; });
tl.addEventListener('pointerup', () => { tl.onpointermove = null; });
// ---- timestamp marks: press ⏱ Mark (or M) while watching; saved per project ----
const MKEY = KEY + '-marks';
let marks = []; try { marks = JSON.parse(store.get(MKEY) || '[]'); } catch (e) {}
const markBoxes = [], markCounts = [];
function fmtT(x) { return x.toFixed(2) + ' s'; }
function drawMarks() {
  document.querySelectorAll('#tl .mk').forEach((el) => el.remove());
  markBoxes.forEach((b) => { b.innerHTML = ''; });
  const per = {};
  marks.slice().sort((a, b) => a - b).forEach((m) => {
    const d = document.createElement('div'); d.className = 'mk'; d.style.left = (m / DUR * 100) + '%'; $('tl').appendChild(d);
    const i = SCENE_AT(m); per[i] = (per[i] || 0) + 1;
    const box = markBoxes[i]; if (!box) return;
    const c = document.createElement('span'); c.className = 'mchip'; c.title = 'Go to this moment';
    c.textContent = '⏱ ' + fmtT(m);
    c.onclick = (e) => { e.stopPropagation(); LOOP_OFF(); SEEK(m); };
    const x = document.createElement('button'); x.textContent = '✕'; x.title = 'Remove mark'; x.setAttribute('aria-label', 'Remove mark');
    x.onclick = (e) => { e.stopPropagation(); marks = marks.filter((k) => k !== m); store.set(MKEY, JSON.stringify(marks)); drawMarks(); };
    c.appendChild(x); box.appendChild(c);
  });
  markCounts.forEach((el, i) => { el.textContent = per[i] ? `⏱ ${per[i]}` : ''; });
}
function addMark() {
  const m = Math.round(GET_T() * 100) / 100;
  if (!marks.some((k) => Math.abs(k - m) < 0.05)) marks.push(m);
  store.set(MKEY, JSON.stringify(marks)); drawMarks();
  toast(`Marked ${fmtT(m)} · scene ${SCENE_AT(m) + 1}`);
}
$('markb').onclick = addMark;
$('markov').onclick = (e) => { e.stopPropagation(); addMark(); };
$('markov').addEventListener('dblclick', (e) => e.stopPropagation());
document.addEventListener('keydown', (e) => { if (/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return; if (e.key === 'm' || e.key === 'M') { e.preventDefault(); addMark(); } });
function marksFor(i) { return marks.filter((m) => SCENE_AT(m) === i).sort((a, b) => a - b); }
// scene cards
const cards = [];
P.scenes.forEach((s, i) => {
  const c = document.createElement('div'); c.className = 'scene';
  const img = document.createElement('img'); img.src = `thumbs/scene_${String(i + 1).padStart(2, '0')}.jpg`; img.alt = 'scene ' + (i + 1);
    const box = document.createElement('div');
  const h = document.createElement('h3');
  h.innerHTML = `<span class="chip" style="background:${COLORS[i % COLORS.length]}">${i + 1}</span> ${s.start.toFixed(1)}–${s.end.toFixed(1)} s · ${s.set}${s.variant ? ' / ' + s.variant : ''}`;
  const mc = document.createElement('span'); mc.className = 'mcount'; h.appendChild(mc); markCounts[i] = mc;
  const mb = document.createElement('div'); mb.className = 'marks'; markBoxes[i] = mb;
  const p = document.createElement('p'); p.textContent = s.desc || '';
  const say = document.createElement('p'); say.className = 'say'; say.textContent = s.say ? '“' + s.say + '”' : '';
  const ta = document.createElement('textarea'); ta.placeholder = 'What should change in this scene? (leave empty if it is fine)'; ta.value = notes[i] || '';
  ta.oninput = () => { notes[i] = ta.value; store.set(KEY, JSON.stringify(notes)); };
  const row = document.createElement('div'); row.className = 'row';
  const pb = document.createElement('button'); pb.textContent = '▶ Play this scene';
  pb.onclick = () => { loopScene = s; $('loop').classList.add('on'); v.currentTime = s.start + 0.01; setPlay(true); };
  row.appendChild(pb);
  box.append(h, p, say, mb, ta, row);
  // click anywhere on the card (not the note box/buttons) = jump the video to this scene
  c.onclick = (e) => { if (e.target.closest('textarea,button,.mchip')) return; LOOP_OFF(); v.currentTime = s.start + 0.01; }; c.append(img, box); $('scenes').appendChild(c); cards.push(c);
});
drawMarks();
let curIdx = -1;
function tick() {
  const t = v.currentTime;
  if (loopScene && (t >= loopScene.end - 0.03 || t < loopScene.start - 0.05)) v.currentTime = loopScene.start + 0.01;
  $('head').style.left = (t / DUR * 100) + '%';
  $('time').textContent = `${t.toFixed(2)} s · scene ${sceneAt(t) + 1}`;
  const i = sceneAt(t); if (i !== curIdx) { cards.forEach((c, k) => c.classList.toggle('cur', k === i)); curIdx = i; }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
// One-click send: saves to the published page's db ("feedback/latest"); the user then just types "check".
// Falls back to copy-to-clipboard when db is not available (opened from disk, signed out, not declared).
let DB = null;
try { if (window.claude && window.claude.use) window.claude.use('db').then((d) => { DB = d; }).catch(() => {}); } catch (e) {}
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 3200); }
async function send(kind, text) {
  if (DB) {
    try { await DB.doc('feedback/latest').set({ kind, text, title: P.title, at: new Date().toISOString() }); toast('Sent ✓ — now just type “check” in the chat'); return; } catch (e) {}
  }
  const o = $('out'); o.style.display = 'block'; o.value = text; o.select();
  try { await navigator.clipboard.writeText(text); toast('Copied — paste it in the chat'); } catch (e) { toast('Copy the text below and paste it in the chat'); }
}
$('copy').onclick = () => {
  const lines = P.scenes.map((s, i) => {
    const n = (notes[i] || '').trim(), mk = marksFor(i);
    if (!n && !mk.length) return null;
    return `Scene ${i + 1} (${s.start.toFixed(1)}–${s.end.toFixed(1)} s)${mk.length ? ' [marked at ' + mk.map(fmtT).join(', ') + ']' : ''}: ${n || '(marked, no note yet: check this moment)'}`;
  }).filter(Boolean);
  send('notes', lines.length ? `Preview feedback for "${P.title}":\n${lines.join('\n')}` : `Preview feedback for "${P.title}": no notes yet.`);
};
$('approve').onclick = () => send('approve', `APPROVED: "${P.title}" — render the final video.`);
// full screen: real fullscreen when allowed, otherwise fill the window
(() => {
  const st = $('stage');
  const isFs = () => document.fullscreenElement === st || document.webkitFullscreenElement === st || st.classList.contains('fakefs');
  function enter() { const r = st.requestFullscreen || st.webkitRequestFullscreen; if (r) { Promise.resolve(r.call(st)).catch(() => st.classList.add('fakefs')); } else st.classList.add('fakefs'); }
  function exit() { if (st.classList.contains('fakefs')) st.classList.remove('fakefs'); else if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document); }
  $('fsb').onclick = () => (isFs() ? exit() : enter());
  $('fsx').onclick = exit;
  st.addEventListener('dblclick', () => (isFs() ? exit() : enter()));
  document.addEventListener('keydown', (e) => { if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return; if (e.key === 'f' || e.key === 'F') { isFs() ? exit() : enter(); } if (e.key === 'Escape') st.classList.remove('fakefs'); if (e.key === ' ') { e.preventDefault(); setPlay(v.paused); } });
})();
</script>
